# SITE SETUP
# Guide: https://docs.hugoblox.com/tutorial/
# Documentation: https://docs.hugoblox.com/

appearance:
  mode: light
  color: blue

marketing:
  seo:
    site_type: Person
    local_business_type: ''
    org_name: 'China University of Mining and Technology, Beijing'
    description: 'Qin Tian works on control and autonomy for autonomous mining trucks, including MPC, LQR, adaptive/fuzzy PID, vehicle dynamics modeling, parameter identification, AEB safety logic, and data-driven control.'
    twitter: ''
  analytics:
    google_analytics: ''
    baidu_tongji: ''
    plausible: ''
    fathom: ''
    pirsch: ''
  verification:
    google: ''
    baidu: ''

header:
  navbar:
    enable: true
    blox: navbar
    align: right
    show_search: false
    show_theme_chooser: false
    show_translations: true
    logo:
      text: 'Qin Tian'
    button:
      enable: false

footer:
  copyright:
    notice: '© {year} Qin Tian. All rights reserved.'
    license:
      enable: false
      allow_derivatives: false
      share_alike: true
      allow_commercial: false

locale:
  date_format: 'Jan 2, 2006'
  time_format: '3:04 PM'

features:
  math:
    enable: true
  privacy_pack:
    enable: false

params:
  fontawesome:
    enable: true
